name: Publish

# Al crear una release en GitHub (tag vX.Y.Z) se publica en Open VSX y se adjunta el .vsix.
# Sin token guardado: Trusted Publishing de Open VSX (OIDC). Hay que registrar en open-vsx.org
# este repo, el archivo `publish.yml` y el entorno `openvsx` (ver docs/publicar.md).
on:
  release:
    types: [published]

permissions:
  contents: write # adjuntar el .vsix a la release
  id-token: write # token OIDC de corta vida para Open VSX

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: openvsx
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Comprobar que el tag coincide con la versión
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "${GITHUB_REF_NAME}" ]; then
            echo "El tag ${GITHUB_REF_NAME} no coincide con package.json (${version})"; exit 1
          fi
      - run: npm run package
      - name: Publicar en Open VSX
        # --trusted-publishing: falla si no hay token OIDC, en vez de buscar otro método.
        # Versión fijada: lo que publica no cambia sin un PR.
        run: npx --yes ovsx@1.4.0 publish heftmap.vsix --trusted-publishing
      - name: Adjuntar el .vsix a la release
        run: gh release upload "${GITHUB_REF_NAME}" heftmap.vsix --clobber
        env:
          GH_TOKEN: ${{ github.token }}
